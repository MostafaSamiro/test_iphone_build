name: Build Moragaa Osama Android APK
on:
  push:
    branches:
      - chatgpt-moragaa-android-build
    paths:
      - 'moragaa-osama-android/**'
      - '.github/workflows/build-moragaa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble installable Android application
        run: gradle -p moragaa-osama-android --no-daemon --stacktrace assembleDebug
      - name: Verify embedded UI and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('moragaa-osama-android/app/src/main/assets/index.html').read_text()
          assert 'التعليم العالي' in html
          for name in ['train','refs','bank','errors','notes','exams','ai']:
              assert f'id="{name}"' in html
          Path('/tmp/moragaa.js').write_text(html.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/moragaa.js
      - name: Stage apk
        run: |
          mkdir -p dist
          cp moragaa-osama-android/app/build/outputs/apk/debug/app-debug.apk dist/Moragaa_Osama.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moragaa-Osama-APK
          path: dist/Moragaa_Osama.apk
          retention-days: 30
      - name: Package Android Studio source
        run: zip -qr Al_Taleem_Al_Aali_AndroidStudio.zip moragaa-osama-android -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Taleem-AndroidStudio-Source
          path: Al_Taleem_Al_Aali_AndroidStudio.zip
          retention-days: 30
      - name: Commit APK to isolated build branch
        continue-on-error: true
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f dist/Moragaa_Osama.apk
          git commit -m 'Build Moragaa Osama APK' || true
          git push

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK for smoke test
        run: gradle -p moragaa-osama-android --no-daemon assembleDebug
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r moragaa-osama-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.osama.altaleemalaali/com.osama.moragaa.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep -q com.osama.altaleemalaali
            adb shell screencap -p /sdcard/smoke.png
            adb pull /sdcard/smoke.png smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-screenshot
          path: smoke.png
