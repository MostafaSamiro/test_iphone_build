.game{width:100%;max-width:500px;min-height:100%;height:auto;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;padding-bottom:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.balance{display:flex;align-items:center;gap:8px;background:#001b1bd9;border:1px solid #ffffff30;border-radius:22px;padding:8px 12px;font-size:14px}.balance strong{font-size:17px;direction:ltr}
.add{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#35b96c;font-size:22px}
h1{text-align:center;font-size:20px;letter-spacing:1px;margin:14px 0 15px;direction:ltr;text-shadow:0 3px 10px #001}
.board-wrap{padding:0 0 10px;margin-top:8px;border-radius:0;background:transparent;backdrop-filter:none;border:0}
.board{display:grid;direction:ltr;grid-template-columns:clamp(39px,10.8vw,45px) repeat(5,minmax(0,1fr));gap:0 0;align-items:center}
.multiplier{min-height:clamp(36px,10vw,47px);display:grid;place-items:center;border-radius:11px;background:#004432d9;color:#c8e8d4;font-size:clamp(10px,3vw,14px);font-weight:bold;border:1px solid #a4ffc51a}
.multiplier.active{background:linear-gradient(135deg,#59dd75,#159a4c);color:#fff;box-shadow:0 0 17px #5bff8277}
.apple{width:100%;aspect-ratio:1;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;min-width:0;touch-action:manipulation}
.apple img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 5px #0019)}
.apple:disabled{cursor:default}.apple:not(:disabled):active{transform:scale(.94)}
 .status{display:none!important}
#resultPopup{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.96);z-index:1000;width:min(84vw,360px);padding:20px 16px;border-radius:18px;text-align:center;font-size:21px;font-weight:900;line-height:1.5;color:#fff;background:linear-gradient(135deg,#073d32e8,#051e1be8);border:2px solid #d9b16a;box-shadow:0 8px 30px #0009,inset 0 0 0 3px #ffffff12;backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s}
#resultPopup.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
#resultPopup.win{border-color:#a5f58c;color:#d5ffc7}
#resultPopup.lose{border-color:#e9a18b;color:#ffd0c5}
#resultPopup small{font-size:13px;color:#fff;margin-top:6px}
.controls{padding:0;border-radius:0;background:transparent;border:0;backdrop-filter:none;margin-bottom:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick button,.bottom button{border:1px solid #ffffff40;border-radius:11px;background:linear-gradient(#459bd1,#24699f);color:#fff;padding:12px 3px;font-weight:bold;min-height:46px}
.betrow{display:flex;gap:8px;margin-top:10px;align-items:stretch}#bet{width:100%;min-width:0;background:#001923e8;color:#fff;border:1px solid #91c6dd66;border-radius:12px;padding:10px;font-size:23px;text-align:center;direction:ltr;min-height:60px}
.action{min-width:110px;border:1px solid #ffffff55;border-radius:12px;background:linear-gradient(#59a8e4,#2677bb);color:#fff;padding:12px 7px;font-weight:bold;min-height:60px}.action.cash{background:linear-gradient(#ffdc70,#e9a32c);color:#482b08}
small{display:block;text-align:center;color:#c2dfd0;margin-top:8px;font-size:11px;line-height:1.6}.bottom{display:flex;gap:8px;margin-top:10px}.bottom button{flex:1;background:#075b45}
@media(max-width:430px){.board{grid-template-columns:clamp(38px,10.6vw,44px) repeat(5,minmax(0,1fr));gap:0 0}.board-wrap{padding:0;margin-top:8px;background:transparent;border:0}.apple{max-height:none}.controls{padding:0;background:transparent;border:0}.quick button{font-size:12px}.action{min-width:94px}}

/* Mobile full-screen fit: keep the complete game board and controls inside the visible screen. */
html,body{width:100%;height:100%;min-height:0;overflow:hidden}
body{height:100dvh;min-height:0;padding:4px 5px 5px;overflow:hidden}
main.game{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.top{flex:0 0 auto;margin:0;min-height:32px}

.board{flex:1 1 auto;min-height:0;grid-template-rows:repeat(10,minmax(0,1fr));gap:1px 1px;align-content:stretch}
.multiplier{min-height:0;height:100%;font-size:clamp(9px,2.6vw,12px);border-radius:8px}
.apple{min-height:0;height:100%;aspect-ratio:auto;padding:0}
.apple img{width:100%;height:100%;max-height:none;object-fit:contain}

.bottom{margin-top:5px;gap:5px}
@media(max-height:700px){body{padding:2px 4px}h1{margin:1px 0 2px}.controls{padding:4px}.quick button,.bottom button{min-height:32px}.betrow{margin-top:3px}#bet,.action{min-height:38px}small{display:none}.status{display:none}}

/* Compact wood/apple tiles and a seven-row scrolling viewport like the reference video. */
.board-wrap{flex:0 0 auto;height:calc(7 * var(--tile-size) + 28px);min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;padding:4px 3px 5px;margin-top:12px;background:transparent;border:0;border-radius:0}
.board-wrap::-webkit-scrollbar{display:none}
.board{height:calc(10 * var(--tile-size) + 18px);min-height:0;grid-template-rows:repeat(10,var(--tile-size));gap:2px 2px;align-content:start}
:root{--tile-size:clamp(43px,12vw,58px)}
.apple{width:calc(100% - 5px);height:calc(var(--tile-size) - 3px);justify-self:center;align-self:center;overflow:visible}
.apple img{width:100%;height:100%;object-fit:contain}
@media(max-height:700px){:root{--tile-size:clamp(38px,10vw,50px)}.board-wrap{height:calc(7 * var(--tile-size) + 22px)}}

/* Reference-video depth effect: active row and two rows above stay clear; farther rows fade. */
.apple,.multiplier{transition:opacity .22s ease,transform .18s ease}

&lt;h1&gt;Apple Of Fortune&lt;/h1&gt;
&lt;p class=&quot;rules-intro&quot;&gt;جرب حظك! اذق أحد تفاحات سنو وايت!&lt;/p&gt;
&lt;h2&gt;كيفية اللعب&lt;/h2&gt;
&lt;ol&gt;
&lt;li&gt;ضع الرهان. يتم تحديد مبلغ الرهان الأولي قبل بداية اللعبة.&lt;/li&gt;
&lt;li&gt;الحد الأقصى للرهان 71975.5 ج.م، الحد الأدنى للرهان 10 ج.م.&lt;/li&gt;
&lt;li&gt;أمامك 10 صفوف من 5 خلايا. تحتوي كل خلية على تفاحة. يمكن أن تكون التفاحات سيئة أو جيدة.&lt;/li&gt;
&lt;li&gt;الآن خمن أين تم إخفاء التفاحات الناضجة! افتح خلية واحدة في كل مستوى من المستويات الـ 10.&lt;/li&gt;
&lt;li&gt;إذا فتحت خلية تحتوي على تفاحة جيدة، ستزيد مكاسبك وسيُمكنك المضي إلى المستوى التالي.&lt;/li&gt;
&lt;li&gt;إذا وجدت تفاحة فاسدة عند فتح الخلية، ستخسر وتنتهي اللعبة.&lt;/li&gt;
&lt;li&gt;يمكنك التوقف في أي مستوى وسحب أرباحك.&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;يتم تقريب المعاملات المعروضة إلى منزلتين عشريتين. يتم حساب الأرباح باستخدام الاحتمالات الكاملة.&lt;/p&gt;
&lt;p&gt;يجب إكمال اللعبة في غضون 7 أيام منذ بدئها وإلا سيتم إغلاقها وفقدانها تلقائيًا.&lt;/p&gt;
&lt;p&gt;إذا واجهت أي مشاكل، يرجى الاتصال بنا في غضون 3 أيام من إنهاء اللعبة.&lt;/p&gt;
&lt;/article&gt;

   const multiplierRows=board.querySelectorAll('.multiplier');
   const pitch=multiplierRows.length&gt;=2
      ? multiplierRows[1].getBoundingClientRect().top-multiplierRows[0].getBoundingClientRect().top

   const maximum=Math.max(0,viewport.scrollHeight-viewport.clientHeight);

   if(immediate || window.matchMedia('(prefers-reduced-motion: reduce)').matches){

   }

function setBet(type){let input=document.getElementById('bet'),v=Number(input.value)||MIN_BET;if(type==='max')v=balance;else if(type==='half')v=v/2;else if(type==='double')v=v*2;else v=MIN_BET;input.value=Math.max(MIN_BET,Math.min(balance,v)).toFixed(2);syncQuickButtons();}
function playGame(){
 if(playing){cashOut();return}
 bet=Number(document.getElementById('bet').value);
 if(!Number.isFinite(bet)||bet&lt;MIN_BET){message('أدخل مبلغ رهان صحيحاً','');return}
 if(bet&gt;balance){message('الرصيد غير كافٍ لهذا الرهان','');return}
 balance-=bet;playing=true;createRound();message('اختار تفاحة واحدة من الصف السفلي','');update();
}
function chooseApple(r,c){
 if(!playing || pendingPick || r!==currentRow || picked.some(p=&gt;p.r===r))return;
 // V19: show the short 1X loading effect in the center of the screen, not on the apple itself.
 pendingPick=true;
 const version=roundVersion;
 const viewport=document.querySelector('.board-wrap');
 const tile=board.children[r*(COLS+1)+c+1];
 if(viewport)viewport.classList.add('selection-pending');
 clearPickLoader();
 if(tile)tile.classList.add('awaiting-reveal');
 const loader=document.createElement('span');
 loader.className='pick-loader';
 loader.setAttribute('aria-hidden','true');
 loader.innerHTML='&lt;span class=&quot;loader-ring&quot;&gt;&lt;/span&gt;';
 document.body.appendChild(loader);
 const cash=document.getElementById('cashoutBtn');
 if(cash)cash.disabled=true;
 // Ignore repeated taps; no payout, reveal, row movement or balance change until the effect completes.
 pickTimer=setTimeout(()=&gt;{
   if(version!==roundVersion || !playing){clearPickLoader();return;}
   pendingPick=false;
   clearPickLoader();
   if(viewport)viewport.classList.remove('selection-pending');
   picked.push({r,c});
   if(safe[r].includes(c)){
     steps++;
     if(steps===ROWS){
       const prize=bet*MULT[ROWS-1];
       balance+=prize;
       playing=false;revealAll=true;render();update();
       message('أحسنت! انتهت الجولة بنجاح — '+prize.toFixed(2)+' ج.م','win',prize);
       return;
     }
     currentRow--;render();update();
     setTimeout(()=&gt;{if(playing &amp;&amp; !pendingPick &amp;&amp; version===roundVersion)scrollBoardToCurrentRow();},70);
     message('تفاحة سليمة! اختار تفاحة من الصف التالي','');
   }else{
     playing=false;revealAll=true;render();update();
     message('انتهت الجولة. التفاحة كانت خطرة. ابدأ جولة جديدة للمحاولة مرة أخرى','lose',bet);
   }
 },440);
}
function cashOut(){clearPickLoader();if(!playing || pendingPick)return;if(steps===0){message('اختار تفاحة سليمة واحدة على الأقل قبل تحصيل الرصيد','');return;}let prize=bet*MULT[steps-1];balance+=prize;playing=false;revealAll=true;render();update();message('تم تحصيل '+prize.toFixed(2)+' ج.م إلى رصيدك الافتراضي','win',prize);}
function syncQuickButtons(){
 const buttons=document.querySelectorAll('.quick button');
 if(buttons.length!==4)return;
 const value=Number(document.getElementById('bet').value)||MIN_BET;
 const upper=Number(document.getElementById('bet').max||71975.5);
 buttons[0].disabled=playing || balance&lt;MIN_BET;
 buttons[1].disabled=playing;
 buttons[2].disabled=playing || value*2&gt;Math.min(balance,upper);
 buttons[3].disabled=playing;
}
function update(){
 document.getElementById('balance').textContent=balance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 const p=document.getElementById('play');
 p.textContent='الرهان';p.classList.remove('cash');
 updateBetMeta();
 document.getElementById('bet').disabled=playing;
 document.querySelector('main.game').classList.toggle('in-round',playing);
 syncQuickButtons();
 const payout=steps&gt;0 ? bet*MULT[steps-1] : 0;
 document.getElementById('currentEarnings').textContent=payout.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 document.getElementById('cashoutBtn').disabled=steps===0 || !playing;
}

function updateBetMeta(){
 const meta=document.getElementById('betMeta');
 if(!meta)return;
 const max=Number(document.getElementById('bet').max||71975.5);
 meta.textContent='min 10 ج.م - max '+max.toLocaleString('en-US',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
}
function message(t,type,amount){
 const status=document.getElementById('status');
 status.textContent=t;
 status.className='status'+(type?' '+type:'');
 const pop=document.getElementById('resultPopup');
 clearTimeout(window.__resultTimer);
 if(type==='win'||type==='lose'){
  const amountValue=Number(amount);
  const value=Number.isFinite(amountValue)?amountValue:(type==='lose'?bet:0);
  const scene=document.querySelector('main.game');
  scene.classList.add('has-result');
  // The original screenshot begins with the highest multipliers at the top.
  // Reveal all actual apples and anchor the board without resetting the game state.
  const viewport=document.querySelector('.board-wrap');
  if(typeof boardMotionRAF!=='undefined' &amp;&amp; boardMotionRAF)cancelAnimationFrame(boardMotionRAF);
  if(viewport)viewport.scrollTop=0;
  window.parent.postMessage({type:'GAME_RESULT_STATE',shown:true},'*');
  const money=value.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
  const replayBet=bet.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
  const canReplay=balance&gt;=bet;
  const title=type==='win'?'فوز':'حظ أوفر في المرة القادمة!';
  const subtitle=type==='win'?'لقد ربحت &lt;strong dir=&quot;ltr&quot;&gt;'+money+'&lt;/strong&gt; ج.م':'حاول مرة أخرى';
  pop.className='show '+type;
  pop.innerHTML='&lt;div class=&quot;round-end-copy&quot;&gt;&lt;div class=&quot;round-end-title&quot;&gt;'+title+'&lt;/div&gt;'+ 
    '&lt;div class=&quot;round-end-detail&quot;&gt;'+subtitle+'&lt;/div&gt;&lt;/div&gt;'+ 
    '&lt;div class=&quot;round-end-actions&quot;&gt;&lt;button type=&quot;button&quot; '+(canReplay?'':'disabled')+
    ' onclick=&quot;repeatRound()&quot;&gt;العب مرة أخرى ('+replayBet+' ج.م)&lt;/button&gt;'+ 
    '&lt;button type=&quot;button&quot; onclick=&quot;newBetFromResult()&quot;&gt;رهان جديد&lt;/button&gt;&lt;/div&gt;';
 }else{
  document.querySelector('main.game').classList.remove('has-result');
  pop.className='';pop.textContent='';
  window.parent.postMessage({type:'GAME_RESULT_STATE',shown:false},'*');
 }
}
function newBetFromResult(){
 const pop=document.getElementById('resultPopup');pop.className='';pop.textContent='';document.querySelector('main.game').classList.remove('has-result');window.parent.postMessage({type:'GAME_RESULT_STATE',shown:false},'*');
 if(playing)return;
 createRound();message('حدد مبلغ الرهان ثم اضغط الرهان','');
}
function repeatRound(){
 if(playing||balance&lt;bet)return;
 document.getElementById('resultPopup').className='';
 document.querySelector('main.game').classList.remove('has-result');
 window.parent.postMessage({type:'GAME_RESULT_STATE',shown:false},'*');
 document.getElementById('bet').value=bet.toFixed(2);
 playGame();
}
function newGame(){if(playing){message('حصّل الأرباح أو أكمل الجولة الحالية أولاً','');return;}createRound();message('جولة جديدة — حدد مبلغ الرهان واضغط «الرهان»','');}
function showBalanceInfo(){message('الرصيد الافتراضي تجريبي فقط ولا توجد معاملات مالية حقيقية','');}
function showRules(){openContentPage('القواعد','rulesContent');}
function showRewards(){openContentPage('المكافآت','rewardsContent');}
function openContentPage(title,contentId){const page=document.getElementById('appleContentPage');document.getElementById('contentPageTitle').textContent=title;document.querySelectorAll('#appleContentPage article').forEach(a=&gt;a.hidden=true);document.getElementById(contentId).hidden=false;page.classList.add('open');page.setAttribute('aria-hidden','false');}
function closeContentPage(){const page=document.getElementById('appleContentPage');page.classList.remove('open');page.setAttribute('aria-hidden','true');}
function showSettings(){const dim=document.getElementById('appleUiDim');document.getElementById('oneTapAmount').value=document.getElementById('bet').value||'20';dim.classList.add('open');dim.setAttribute('aria-hidden','false');}
function closeAppleUi(e){if(e &amp;&amp; e.target!==document.getElementById('appleUiDim'))return;const dim=document.getElementById('appleUiDim');dim.classList.remove('open');dim.setAttribute('aria-hidden','true');}
function chooseOneTapBet(v){
 const input=document.getElementById('oneTapAmount');
 input.value=Number(v).toFixed(2);
 document.querySelectorAll('.one-tap-presets button').forEach(btn=&gt;{
   const selected=Number(btn.textContent.trim())===Number(v);
   btn.classList.toggle('selected',selected);
   btn.setAttribute('aria-pressed',selected?'true':'false');

<script>
const gameFrame=document.getElementById('gameFrame');
const imxFrame=document.getElementById('imxFrame');
window.addEventListener('message',event=>{
 const data=event.data;
 if(!data||!gameFrame||!imxFrame)return;
 if(event.source===gameFrame.contentWindow&&data.type==='GAME_RESULT_STATE'){document.body.classList.toggle('game-result-visible',!!data.shown);return;}
 if(event.source===gameFrame.contentWindow&&data.type==='IMX_OPEN'){openIMXPanel();return;}
 if(event.source===imxFrame.contentWindow&&data.type==='IMX_READ_REQUEST'){
   gameFrame.contentWindow.postMessage(data,'*');return;
 }
 if(event.source===gameFrame.contentWindow&&data.type==='IMX_READ_RESULT'){
   imxFrame.contentWindow.postMessage(data,'*');
 }
});
</script>
<script>
function openIMXPanel(){
  const overlay=document.getElementById('imxOverlay');
  if(!overlay) return;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
}
function closeIMXPanel(){
  const overlay=document.getElementById('imxOverlay');
  if(!overlay) return;
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
}
(function(){
  const overlay=document.getElementById('imxOverlay');
  const closeBtn=document.getElementById('imxClose');
  const openBtn=document.getElementById('imxFab');
  if(openBtn) openBtn.addEventListener('click',openIMXPanel);
  if(closeBtn) closeBtn.addEventListener('click',closeIMXPanel);
  if(overlay) overlay.addEventListener('click',function(e){if(e.target===overlay)closeIMXPanel();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeIMXPanel();});
})();
</script>
<script>
/* Fit the existing IMX window to its current page, including login and the 10-row board. */
(function(){
 const frame=document.getElementById('imxFrame');
 const modal=document.getElementById('imxModal');
 if(!frame||!modal)return;
 function fit(){
  try{
   const doc=frame.contentDocument;
   if(!doc)return;
   const app=doc.getElementById('mainAppWrapper');
   const loader=doc.getElementById('access-loader-view');
   const appHeight=app&&app.getBoundingClientRect().height||0;
   const loaderHeight=loader&&loader.getBoundingClientRect().height||0;
   const contentHeight=Math.max(appHeight,loaderHeight);
   if(contentHeight<100)return;
   const allowed=Math.floor(window.innerHeight*.91);
   const desired=Math.max(320,Math.ceil(contentHeight+58));
   modal.style.setProperty('height',Math.min(allowed,desired)+'px','important');
  }catch(err){/* fallback to fixed responsive modal dimensions */}
 }
 frame.addEventListener('load',()=>{
  try{
   const doc=frame.contentDocument;
   if(typeof ResizeObserver==='function'){
    const observer=new ResizeObserver(fit);
    ['mainAppWrapper','access-loader-view'].forEach(id=>{let el=doc.getElementById(id);if(el)observer.observe(el);});
    frame.__imxFitObserver=observer;
   }
  }catch(err){}
  fit();
 });
 window.addEventListener('resize',fit);
})();
</script>
<script>(function(){
  const btn=document.getElementById('imxFab');
  if(!btn) return;
  const key='apple_imx_fab_pos_v18';
  let dragging=false,startX=0,startY=0,originX=0,originY=0,moved=false;
  function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
  function applyPos(x,y){
    const maxX=window.innerWidth-btn.offsetWidth-6;
    const maxY=window.innerHeight-btn.offsetHeight-6;
    x=clamp(x,6,maxX); y=clamp(y,6,maxY);
    btn.style.setProperty('left',x+'px','important');
    btn.style.setProperty('top',y+'px','important');
    btn.style.setProperty('right','auto','important');
    btn.style.setProperty('bottom','auto','important');
  }
  function savePos(){try{localStorage.setItem(key,JSON.stringify({left:parseFloat(btn.style.left)||12,top:parseFloat(btn.style.top)||window.innerHeight-btn.offsetHeight-12}));}catch(e){/* may be unavailable for local files */}}
  function restorePos(){
    try{const p=JSON.parse(localStorage.getItem(key)||'null'); if(p&&Number.isFinite(p.left)&&Number.isFinite(p.top)){applyPos(p.left,p.top); return;}}catch(e){}
    applyPos(window.innerWidth-btn.offsetWidth-8, window.innerHeight>760 ? window.innerHeight-btn.offsetHeight-198 : window.innerHeight-btn.offsetHeight-181);
  }
  btn.addEventListener('pointerdown',e=>{dragging=true;moved=false;startX=e.clientX;startY=e.clientY;originX=parseFloat(btn.style.left)|| (window.innerWidth-btn.offsetWidth-12);originY=parseFloat(btn.style.top)|| (window.innerHeight>760 ? window.innerHeight-btn.offsetHeight-198 : window.innerHeight-btn.offsetHeight-181);btn.classList.add('dragging');btn.setPointerCapture && btn.setPointerCapture(e.pointerId);});
  btn.addEventListener('pointermove',e=>{if(!dragging) return; const dx=e.clientX-startX, dy=e.clientY-startY; if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true; applyPos(originX+dx, originY+dy);});
  function endDrag(e){if(!dragging) return; dragging=false; btn.classList.remove('dragging'); try{btn.releasePointerCapture && btn.releasePointerCapture(e.pointerId);}catch(err){} savePos();}
  btn.addEventListener('pointerup',endDrag); btn.addEventListener('pointercancel',endDrag);
  btn.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false;return false;}} , true);
  window.addEventListener('resize',()=>{const x=parseFloat(btn.style.left),y=parseFloat(btn.style.top);if(Number.isFinite(x)&&Number.isFinite(y))applyPos(x,y);savePos();});
